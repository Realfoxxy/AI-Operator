[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orkestra"
version = "0.2.0"
description = "Claude, Gemini ve GitHub Copilot'u tek bir ekip gibi çalıştıran çok-ajanlı orkestratör (resmi CLI'lar, sıfır bağımlılık)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["ai", "agents", "orchestrator", "claude", "gemini", "copilot", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Natural Language :: Turkish",
]

[project.urls]
"Kaynak" = "https://github.com/Realfoxxy/AI-Operator"
"Dokümantasyon" = "https://github.com/Realfoxxy/AI-Operator/blob/main/DOKUMANTASYON.md"

[project.scripts]
orkestra = "orkestra.__main__:main"

[tool.setuptools]
packages = ["orkestra"]

[tool.setuptools.package-data]
orkestra = ["web/index.html", "web/style.css", "web/app.js", "varsayilan_config.toml"]
