name: Testler

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Birim testleri
        run: python -m unittest -v
      - name: kur.ps1 Windows PowerShell 5.1 ile ayrıştırılabilir mi?
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\kur.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "kur.ps1 sorunsuz ayrıştırıldı."
      - name: Sahte ajanlarla uçtan uca çalıştırma
        shell: bash
        run: python -m orkestra run --mock --yes --workspace "$RUNNER_TEMP/orkestra-calisma" "CI denemesi"
      - name: Güvenlik taraması (shell=True ve harici import yok)
        shell: bash
        run: |
          ! grep -rn "shell=True" orkestra/
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          bad = []
          for f in pathlib.Path("orkestra").glob("*.py"):
              for node in ast.walk(ast.parse(f.read_text(encoding="utf-8"))):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      names = [node.module]
                  else:
                      continue
                  bad += [f"{f}: {n}" for n in names if n.split(".")[0] not in stdlib]
          print("\n".join(bad) or "Yalnızca standart kütüphane kullanılıyor.")
          sys.exit(1 if bad else 0)
          PY
