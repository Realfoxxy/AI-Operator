name: Sürüm yayımla

# İki yoldan çalışır:
#   1. Bir "v*" etiketi gönderildiğinde (git tag v0.2.1 && git push origin v0.2.1)
#   2. Elle: Actions → "Sürüm yayımla" → Run workflow (etiket yoksa iş akışı oluşturur)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm etiketi (ör. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.surum || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Etiket biçimini denetle
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Geçersiz sürüm etiketi: $TAG (beklenen: vX.Y.Z)"; exit 1
          fi
      - name: Testler
        run: python -m unittest
      - name: Paketleri oluştur
        run: |
          python -m pip install --upgrade build
          python -m build
          git archive --format=zip --prefix=orkestra/ -o "dist/orkestra-${TAG}.zip" HEAD
      - name: GitHub sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Orkestra ${TAG}" \
            --notes "Kurulum: orkestra-${TAG}.zip dosyasını indirip açın ve README'deki adımları izleyin (Linux/macOS: bash kur.sh · Windows: kur.ps1). pipx ile: pipx install git+https://github.com/${GITHUB_REPOSITORY}.git@${TAG}" \
            --generate-notes
