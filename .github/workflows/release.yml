name: Sürüm yayımla

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testler
        run: python -m unittest
      - name: Paketleri oluştur
        run: |
          python -m pip install --upgrade build
          python -m build
          git archive --format=zip --prefix=orkestra/ -o "dist/orkestra-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: GitHub sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Orkestra ${GITHUB_REF_NAME}" \
            --notes "Kurulum: ZIP dosyasını indirip açın ve README'deki adımları izleyin (bash kur.sh veya kur.ps1). pipx ile: pipx install git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_REF_NAME}" \
            --generate-notes
